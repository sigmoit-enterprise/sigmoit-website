<!doctype html>
<html lang="en" class="h-full bg-white">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#24a556" />

    <link rel="icon" type="image/png" href="/logo2.png" />
    <link rel="apple-touch-icon" href="/logo2.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Title and description here are fallbacks only. scripts/prerender.mjs
      injects the real per-route title, description, canonical, Open Graph tags
      and JSON-LD into each generated page before </head>.
    -->
    <title>SigmoIT | Top IT Company in Nepal for Digital Solutions</title>
    <meta
      name="description"
      content="SigmoIT is a leading IT company in Nepal delivering custom software, web and mobile app development, cloud and DevOps, and UI/UX design."
    />

    <!-- Fonts: preconnect early, then load non-blocking so text paints first. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700&family=Tiro+Devanagari+Hindi:ital@0;1&family=Kalam:wght@300;400;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700&family=Tiro+Devanagari+Hindi:ital@0;1&family=Kalam:wght@300;400;700&display=swap"
      />
    </noscript>
  </head>
  <body class="h-full text-sigmo-dark antialiased font-sans bg-white">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
